    demoRun: function (n) { startDemo(); demo.room = starters[0]; demo.rec = DEMOS[starters[0].id] || null; demo.rk = 0; demo.rleft = demo.rec ? demo.rec[1] : 0; resetRun(); for (var i = 0; i < n && !run.won; i++) step(demoInput()); return { steps: i, won: run.won, deaths: run.deaths, stage: demo.stage }; }
  };
})();
</script>
