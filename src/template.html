<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Climber Slice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; background: #0a0d1c; overflow: hidden; }
  #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #world { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
  .para { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; }
  #stage canvas { position: absolute; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage"></div>

<!-- Built-in starter rooms (level format v1). The game only ever reads rooms as data through loadRoom(). -->
<script type="application/json" id="starter-rooms">[/*ROOM_JSON*/]</script>

<script>
(function () {
  'use strict';

/*SHARED_SCREEN*/
  var LW = SCREEN.w, LH = SCREEN.h, MX = LW / 2, STEP = 1 / 60;   // the screen (shared-screen.js); a room is LW wide and one or two screens tall (RH)
  var RH = LH;
  var K = 1.25; // tiles are 10px, so classic 8px-tile platformer speeds are scaled up by 10/8

  // ---- movement tuning (px and seconds) ----
  var P = {
    maxRun: 90 * K, runAccel: 1000 * K, runReduce: 400 * K, airMult: 0.65,
    gravity: 900 * K, maxFall: 160 * K, wallSlideStart: 20 * K, wallSlideTime: 1.2, halfGravBelow: 40 * K,
    jumpSpeed: -105 * K, jumpHBoost: 40 * K, varJumpTime: 0.2,
    coyote: 0.1, jumpBuffer: 0.1, dashBuffer: 0.08,
    dashSpeed: 240 * K, endDashSpeed: 160 * K, dashTime: 0.15, dashCooldown: 0.2, dashFreeze: 0.05,
    wallJumpH: 130 * K, wallJumpForce: 0.16, wallCheck: 3, wallBoostTime: 0.2,
    superH: 260 * K, hyperH: 325 * K, hyperV: 0.5,   // jump out of a ground dash: a super (long and high) or, holding down, a hyper (longer and low)
    bounceH: 170 * K, bounceV: -160 * K, bounceVarTime: 0.25, bounceForce: 0.2, bounceCheck: 5,   // wall bounce: dash up beside a wall, then jump
    climbUp: -45 * K, climbDown: 80 * K, climbAccel: 900 * K, climbHop: -120 * K, mantleSpeed: 90 * K, mantleTime: 0.35,
    stamina: 110, dashCost: 60, climbUpCost: 45.45, climbStillCost: 10, climbJumpCost: 27.5, tiredBelow: 20,
    cornerCorrect: 4, iceGrip: 0.1, crumbleDelay: 0.5, crumbleRespawn: 2.5, moverSpeed: 45, moverWait: 0.4, zipSpeed: 160, zipWind: 0.1, zipRest: 0.5, zipBack: 45, jetOff: 1.3, jetWarn: 0.35, jetOn: 0.75, droneSpeed: 40, droneWait: 0.6, droneFire: 0.3, lavaRise: 5, lavaDelay: 15, springV: -185 * K, fireSpeed: 60, fireWait: 0.15, exitTime: 0.35, dieTime: 0.28, hurtTime: 0.06, spawnTime: 0.3, refillRespawn: 2.5,
    // combat (Broforce-inspired, tuned for a 270 px room): the blaster fires level from the chest, fast and short-ranged; a
    // raider walks a short beat, sees you only on his own level and in front (height is armour), shows a ! for a moment,
    // then fires slow shots you can jump. One hit kills either of you. A shot barrel blows up and takes raiders with it.
    shotRate: 0.13, shotSpeed: 420, shotRange: 190, gunHold: 0.45, hitStop: 0.05,
    foeWalk: 16, foeWait: 0.9, foeSight: 150, foeAlert: 0.6, foeFireGap: 1.1, foeShot: 125, foeForget: 1.5, foeLevel: 6,
    blastR: 28, barrelFuse: 0.12, barrelChain: 0.1,
    // the heavy: a brute twice the raider's height. Takes heavyHP shots (a barrel heavyBlast), touching him kills you (a
    // dash too), walks slower, and fires a scattergun: heavyPellets pellets fanned heavySpread up and down, flying
    // heavyShot px/s for heavyRange px, one blast every heavyGap (the pump)
    heavyHP: 12, heavyBlast: 8, heavyWalk: 9, heavyAlert: 0.5, heavyGap: 1.3, heavyShot: 150, heavyRange: 120, heavyPellets: 3, heavySpread: 0.22
  };

  var C = {
    bg: '#0a0d1c', dot: '#1b2145', solid: '#36416e', cap: '#93a4de', under: '#262f55',
    spike: '#e9edf7', body: '#ffe9b8', tired: '#c7a58c', eye: '#0a0d1c',
    flame: '#ffb74a', flameOut: '#56608a', hurt: '#ff8f7d', smoke: '#8d9ac0', teal: '#5fd6b3', tealDim: '#2b6f66',
    text: '#eef1fa', dim: '#9aa6cc'
  };

/*SHARED_TILES*/

/*SHARED_HERO*/

/*SHARED_FOES*/

/*SHARED_WORLDS*/

  // ---- theme: ORIGINAL, GAME BOY or BLACK AND WHITE (Settings, THEME; climber.theme.v1, read once, a change reloads) ----
  // BLACK AND WHITE is the GAME BOY theme flipped for night play: the same four shades and bands, in black, two flat
  // greys and a pale white. The lightest shade becomes black and the darkest white, so the backgrounds go dark and the
  // walls, hazards, hero and menu ink go light. The middles are solid greys, not dithers: dot patterns were too busy in
  // play (Dan, Oct 2026). GB.on is true for both; GB.kind says which.
  // GAME BOY draws everything in four greens (2-bit, lightest to darkest). Nothing extra runs per frame: the static
  // layer and the hero sheets are snapped to the four shades once when they are built (gbSnap), and every colour the
  // game sets while playing goes through gbColor, cached per colour string, via the 2D context's own setters.
  // Bands keep the old handheld read: sky and backdrop use the two light shades, walls the two dark ones, hazards and
  // movers are dark ink on the light background, and the menus and HUD are inverted (dark ink on the lightest green).
  // There is no see-through on a Game Boy: while playing, an alpha under one half draws nothing and anything over draws
  // solid, and the painted glows are left out. Pins give gameplay signals a fixed shade (dash ready is the darkest, spent
  // is light) so they read without colour.
  var THEME_KEY = 'climberwide.theme.v1', GB = { on: false, live: true, cache: {}, pins: { obj: {}, ui: {} } };
  try { GB.kind = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (GB.kind === 'gb' || GB.kind === 'bw') GB.on = true; else GB.kind = '';
  var GB_PALS = { gb: [[140, 173, 40], [108, 148, 33], [48, 98, 48], [24, 52, 30]],   // lightest, light, dark, darkest
                  bw: [[24, 24, 24], [46, 46, 50], [92, 92, 100], [233, 234, 254]] };   // black, dark grey, grey, white
  var GB_PAL = GB_PALS[GB.kind === 'bw' ? 'bw' : 'gb'];
  function gbHex(c) { return '#' + c.map(function (v) { return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
  var GB_HEX = GB_PAL.map(gbHex);
  function gbLum(r, g, b) { return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
  // the live mapping for things drawn while playing ('obj'), and the inverted one for menus and the HUD ('ui')
  function gbObj(L) { return L > 0.86 ? 0 : L > 0.66 ? 1 : L > 0.34 ? 2 : 3; }
  function gbUi(L) { return L > 0.62 ? 3 : L > 0.4 ? 2 : L > 0.2 ? 1 : 0; }
  function gbRgb(str) {                              // any CSS colour to [r, g, b, a] (a 0..1), through the canvas's own parser
    var x = GB.parse || (GB.parse = document.createElement('canvas').getContext('2d'));
    GB.set.call(x, '#000'); GB.set.call(x, str); var v = GB.get.call(x);
    if (v.charAt(0) === '#') return [parseInt(v.substr(1, 2), 16), parseInt(v.substr(3, 2), 16), parseInt(v.substr(5, 2), 16), 1];
    var m = v.match(/[\d.]+/g) || [0, 0, 0, 1];
    return [+m[0], +m[1], +m[2], m[3] == null ? 1 : +m[3]];
  }
  function gbColor(str, band) {
    var key = band + str, hit = GB.cache[key];
    if (hit) return hit;
    var c = gbRgb(str), pin = GB.pins[band === 'ui' ? 'ui' : 'obj'][c[0] + ',' + c[1] + ',' + c[2]], s, out;
    if (c[3] < 0.5) out = 'rgba(0,0,0,0)';
    else {
      s = pin != null ? pin : band === 'ui' ? gbUi(gbLum(c[0], c[1], c[2])) : gbObj(gbLum(c[0], c[1], c[2]));   // pins hold on every band
      if (GB.kind === 'bw' && band !== 'ui') s = pin === 1 || pin === 2 ? pin : 3;   // BLACK AND WHITE: things in play are solid white on the black (spent and tired keep their greys)
      out = GB_HEX[s];
    }
    GB.cache[key] = out;
    return out;
  }
  function gbPin(list, shade, band) {             // band: 'obj' (play), 'ui' (menus and HUD) or both when left out
    list.forEach(function (c) { var v = typeof c === 'string' ? gbRgb(c) : c; (band ? [band] : ['obj', 'ui']).forEach(function (b) { GB.pins[b][v[0] + ',' + v[1] + ',' + v[2]] = shade; }); });
  }
  if (GB.on) {
    (function () {
      var P2 = CanvasRenderingContext2D.prototype, fs = Object.getOwnPropertyDescriptor(P2, 'fillStyle'), ss = Object.getOwnPropertyDescriptor(P2, 'strokeStyle'), ga = Object.getOwnPropertyDescriptor(P2, 'globalAlpha');
      GB.set = fs.set; GB.get = fs.get;
      function wrap(d) {
        return { get: d.get, configurable: true, set: function (v) { d.set.call(this, GB.live && typeof v === 'string' ? gbColor(v, this.gbBand || 'obj') : v); } };
      }
      Object.defineProperty(P2, 'fillStyle', wrap(fs)); Object.defineProperty(P2, 'strokeStyle', wrap(ss));
      Object.defineProperty(P2, 'globalAlpha', { get: ga.get, configurable: true, set: function (v) { ga.set.call(this, GB.live && v < 1 ? (v < 0.5 ? 0 : 1) : v); } });
    })();
    // gameplay signals: the bandana and tails are darkest while a dash is ready, light once it is spent, a pale flash on refill
    gbPin(HERO.chain.can.concat([HERO.dashColor], HERO.spentPairs.map(function (p) { return p[0]; })), 3, 'obj');
    gbPin(HERO.chain.spent.concat([HERO.spentColor], HERO.spentPairs.map(function (p) { return p[1]; })), 1, 'obj');
    gbPin([HERO.chain.tired[0]], 2, 'obj'); gbPin([HERO.chain.tired[1], HERO.chain.flash], 0, 'obj');
    gbPin([C.teal], 3); gbPin([C.tealDim], 1);                                 // refills and the exit: dark when ready, light when used
    gbPin([C.hurt], 2, 'ui'); gbPin(['#ffc4b8'], 1, 'ui');                               // the meter: darkest cells while a dash is affordable, a step lighter with a pale top when not
    drawGlow = function () {};                                                 // no painted light on a Game Boy
  }
  // Snaps canvases to the shades of a band once (the static layer as it is built, the hero sheets). The cut points come
  // from the canvases' own brightness, so every world keeps its contrast: 'back' puts the darkest 30% of the sky and
  // backdrop on the light shade and the rest on the lightest; 'wall' is only the two dark shades (the brightest 45%, lit
  // edges included, dark; the rest darkest), so a wall's top edge never matches the sky and nothing looks like it floats
  // over a gap; 'ice' is the light shade with dark edges; 'deco' splits decals between light and dark; 'ink' (spikes, tracks, vents) is the two
  // dark shades so a hazard is a dark shape on any background; 'obj' (the hero) uses the fixed live mapping. Several canvases can share one set of cut points (the city layers).
  // Alpha is cut at one half. The canvas is read through a throwaway so it stays on the GPU.
  var GB_BANDS = { back: [[0.3, 1], [1, 0]], wall: [[0.55, 3], [1, 2]], ice: [[0.35, 2], [1, 1]], deco: [[0.5, 2], [1, 1]] };
  if (GB.kind === 'bw') GB_BANDS.wall = [[0.55, 2], [1, 3]];   // BLACK AND WHITE: wall bodies are grey and their lit edges white, so big walls do not glare at night
  function gbSnap(list, band) {
    if (!GB.on) return;
    var reads = list.map(function (cv) {
      var t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height;
      var tg = t.getContext('2d', { willReadFrequently: true }); tg.drawImage(cv, 0, 0);
      return { cv: cv, t: t, tg: tg, d: tg.getImageData(0, 0, cv.width, cv.height) };
    });
    var plan = GB_BANDS[band], cuts = null, i, j, p, n;
    if (plan) {                                      // brightness cut points, from a histogram of every opaque pixel
      var hist = new Uint32Array(256), tot = 0, acc = 0;
      for (j = 0; j < reads.length; j++) for (p = reads[j].d.data, i = 0; i < p.length; i += 4) if (p[i + 3] >= 128) { hist[Math.round(gbLum(p[i], p[i + 1], p[i + 2]) * 255)]++; tot++; }
      cuts = []; n = 0;
      for (i = 0; i < 256 && n < plan.length; i++) { acc += hist[i]; while (n < plan.length && acc >= plan[n][0] * tot) cuts.push([i, plan[n++][1]]); }
      while (n < plan.length) cuts.push([255, plan[n++][1]]);
    }
    for (j = 0; j < reads.length; j++) {
      var R = reads[j];
      for (p = R.d.data, i = 0; i < p.length; i += 4) {
        if (p[i + 3] < 128) { p[i + 3] = 0; continue; }
        var pin = GB.pins.obj[p[i] + ',' + p[i + 1] + ',' + p[i + 2]], L = Math.round(gbLum(p[i], p[i + 1], p[i + 2]) * 255), s;
        if (pin != null) s = pin;
        else if (cuts) { for (n = 0; n < cuts.length - 1 && L > cuts[n][0]; n++); s = cuts[n][1]; }
        else if (band === 'ink') s = GB.kind === 'bw' ? 3 : L > 178 ? 2 : 3;   // hazards are solid dark shapes, pale parts a step lighter (BLACK AND WHITE: solid white)
        else s = gbObj(L / 255);
        if (GB.kind === 'bw' && band === 'obj') s = (pin != null ? pin === 3 : L < 26) ? 0 : 3;   // BLACK AND WHITE hero: a white figure with its outline (and a ready bandana) black, so it stands out on black and on grey walls
        var c = GB_PAL[s];
        p[i] = c[0]; p[i + 1] = c[1]; p[i + 2] = c[2]; p[i + 3] = 255;
      }
      R.tg.putImageData(R.d, 0, 0);
      var cg = R.cv.getContext('2d'); cg.clearRect(0, 0, R.cv.width, R.cv.height); cg.drawImage(R.t, 0, 0);
    }
  }
  // Runs a drawing step on its own layer, snaps it to a band and lays it on b (GAME BOY), or just draws on b.
  function gbStage(b, band, fn) {
    if (!GB.on) return fn(b);
    var t = document.createElement('canvas'); t.width = b.canvas.width; t.height = b.canvas.height;
    var out = fn(t.getContext('2d'));
    gbSnap([t], band); b.drawImage(t, 0, 0);
    return out;
  }

  // ---- level loading: rooms are data, never hard-coded ----
/*SHARED_CONFIG*/
  var LIVE_KEY = 'climberwide.live.v1';
  var starters = JSON.parse(document.getElementById('starter-rooms').textContent); // built-in set, also the offline fallback
  // Worlds and levels. Built-in rooms fill every slot; a published level with the same world and number takes that slot over.
  var PROG_KEY = 'climberwide.progress.v1', prog = {}, levels = [], liveRooms = [], dataVer = 0, unlockAll = location.hash === '#unlock';
  try { prog = JSON.parse(localStorage.getItem(PROG_KEY)) || {}; } catch (e) {}
  function rebuildLevels() {
    levels = WORLDS.map(function (wd, w) {
      // each numbered slot holds the built-in room unless a published level has that number; unnumbered ones go last
      var slot = {}, nums = [], loose = [], i, r, n;
      for (i = 0; i < starters.length; i++) if (worldOf(starters[i]) === w + 1 && starters[i].level > 0) slot[starters[i].level] = starters[i];
      for (i = 0; i < liveRooms.length; i++) { r = liveRooms[i]; if (worldOf(r) === w + 1) { if (r.level > 0) slot[r.level] = r; else loose.push(r); } }
      for (n in slot) nums.push(+n);
      nums.sort(function (a, b) { return a - b; });
      // the saved map order lists slot numbers in the order they should appear; anything it does not mention goes after, in number order
      var want = mapOrder[w + 1] || [], order = [], seen = {};
      for (i = 0; i < want.length; i++) if (slot[want[i]] && !seen[want[i]]) { order.push(want[i]); seen[want[i]] = 1; }
      for (i = 0; i < nums.length; i++) if (!seen[nums[i]]) order.push(nums[i]);
      return order.map(function (k) { return slot[k]; }).concat(loose);
    });
    dataVer++;
  }
  function beaten(r) { return !!prog[r.id]; }
  function worldOpen(w) {
    if (unlockAll || w <= 0) return true;
    for (var i = 0; i < levels[w - 1].length; i++) if (!beaten(levels[w - 1][i]) && !levels[w - 1][i].trial) return false;   // trials never hold the next world back
    return worldOpen(w - 1);
  }
  // a level opens once the level before it is beaten; a trial in the way is skipped over
  function levelOpen(w, i) {
    if (!worldOpen(w)) return false;
    if (unlockAll) return true;
    for (var j = i - 1; j >= 0; j--) if (!levels[w][j].trial) return beaten(levels[w][j]);
    return true;
  }
  function usable(d) {
    return d && d.format === 1 && d.grid && d.grid.cols * d.grid.tile === LW && (d.grid.rows * d.grid.tile === LH || d.grid.rows * d.grid.tile === 2 * LH) && d.tiles && d.tiles.length === d.grid.rows;
  }
  // Published rooms are fetched as plain data. If that fails, the last good copy is used, then the built-in set.
  // One published record is not a room: it holds the order of the levels on the map (set in the builder's Game map).
  var mapOrder = {};
  function useLive(list) {
    var ok = [], doc = null;
    for (var i = 0; i < (list || []).length; i++) { if (list[i] && list[i].kind === 'map') doc = list[i]; else if (usable(list[i])) ok.push(list[i]); }
    mapOrder = (doc && doc.order) || {};
    liveRooms = ok; rebuildLevels();
    return ok.length + (doc ? 1 : 0);
  }
  function fetchLive() {
    if (!window.fetch) return;
    var head = { headers: { apikey: BACKEND.key } }, rows;
    fetch(BACKEND.url + '/rest/v1/' + TB.rooms + '?select=id,name,difficulty,published_version_id&published_version_id=not.is.null', head)
      .then(function (r) { if (!r.ok) throw new Error('rooms ' + r.status); return r.json(); })
      .then(function (list) {
        rows = list;
        if (!rows.length) return [];
        var ids = rows.map(function (x) { return x.published_version_id; }).join(',');
        return fetch(BACKEND.url + '/rest/v1/' + TB.versions + '?select=id,data&id=in.(' + ids + ')', head)
          .then(function (r) { if (!r.ok) throw new Error('versions ' + r.status); return r.json(); });
      })
      .then(function (vers) {
        var byId = {}, out = [], i;
        for (i = 0; i < vers.length; i++) byId[vers[i].id] = vers[i].data;
        for (i = 0; i < rows.length; i++) {
          var d = byId[rows[i].published_version_id];
          if (d) { d.id = rows[i].id; d.name = rows[i].name; d.difficulty = rows[i].difficulty; out.push(d); }
        }
        if (useLive(out)) { try { localStorage.setItem(LIVE_KEY, JSON.stringify(out)); } catch (e) {} }
        else { try { localStorage.removeItem(LIVE_KEY); } catch (e) {} }
      })
      .catch(function () {});
  }

  var room, T, cols, rows, grid, spawn, hazards, exits, refills, tileLayer;
  var crumbles = [], crumbleAt = {}, movers = [], tracks = [], backs = {}, flames = [], fireballs = [], springs = [], gems = [], roomKeys = [], doors = [], doorAt = {}, jets = [], drones = [], lava = null;
  var foes = [], barrels = [], shots = [], foeShots = [], combat = { stop: 0, ev: [] };   // raiders, barrels, the hero's shots, the raiders' shots; ev: what render should show (gibs, blasts)
  var KIND = { '#': 1, 'I': 2, 'C': 3, 'D': 4 }; // 1 brick, 2 ice, 3 crumbling block, 4 locked door

  function buildRoom(data) {
    if (data.format !== 1) { throw new Error('Unsupported level format ' + data.format); }
    if (data.grid.cols * data.grid.tile !== LW || (data.grid.rows * data.grid.tile !== LH && data.grid.rows * data.grid.tile !== 2 * LH) || data.tiles.length !== data.grid.rows) {
      throw new Error('Room must be ' + LW + ' wide and one or two screens (' + LH + ' or ' + 2 * LH + ') tall');
    }
    var th = themeOf(data); setTileTheme(th); C.bg = th.bg; C.dot = th.dot;
    room = data; T = data.grid.tile; cols = data.grid.cols; rows = data.grid.rows;
    setRoomHeight(rows * T);
    grid = []; hazards = []; exits = []; refills = []; spawn = { x: T, y: T };
    crumbles = []; crumbleAt = {}; movers = []; tracks = []; backs = {}; flames = []; fireballs = []; springs = []; gems = []; roomKeys = []; doors = []; doorAt = {}; jets = []; drones = []; lava = null;
    foes = []; barrels = []; shots = []; foeShots = []; combat = { stop: 0, ev: [] }; gibs = []; blasts = []; sparks = []; limbs = [];
    for (var r = 0; r < rows; r++) {
      grid.push([]);
      for (var c = 0; c < cols; c++) {
        var ch = data.tiles[r].charAt(c), x = c * T, y = r * T;
        grid[r].push(KIND[ch] || 0);
        if (ch === 'C') { var cb = { c: c, r: r, x: x, y: y, state: 'idle', t: 0 }; crumbles.push(cb); crumbleAt[r * cols + c] = cb; }
        else if (ch === '-' || ch === '|') tracks.push({ x: x, y: y, v: ch === '|' });
        else if (ch === 'b') backs[r * cols + c] = 1;   // backdrop: scenery only
        if (ch === 'S') spawn = { x: x + 1, y: y };
        else if (ch === 'E') exits.push({ x: x, y: y, w: T, h: T });
        else if (ch === 'o') refills.push({ x: x + 1, y: y + 1, w: T - 2, h: T - 2, timer: 0 });
        else if (ch === '^') hazards.push({ x: x + 1, y: y + 6, w: T - 2, h: 4, dir: 0, tx: x, ty: y });
        else if (ch === 'v') hazards.push({ x: x + 1, y: y, w: T - 2, h: 4, dir: 2, tx: x, ty: y });
        else if (ch === '>') hazards.push({ x: x, y: y + 1, w: 4, h: T - 2, dir: 1, tx: x, ty: y });
        else if (ch === '<') hazards.push({ x: x + 6, y: y + 1, w: 4, h: T - 2, dir: 3, tx: x, ty: y });
        else if (ch === 'u') springs.push({ x: x, y: y, t: 0 });                                  // a spring: land on it to bounce high
        else if (ch === 'G') gems.push({ x: x, y: y, state: 'idle', fx: x, fy: y });                 // a gem: optional, carried to safe ground to keep
        else if (ch === 'k') roomKeys.push({ x: x, y: y, state: 'idle', fx: x, fy: y });                 // a key: follows you and opens the first door you touch

    h.fillStyle = 'rgba(11,16,32,0.88)'; h.fillRect(6 * u, 14 * u, 260 * u, 66 * u);
    t('SCREEN CHECK' + (check === 3 ? '  grid ' + cols + ' x ' + rows : ''), 10, 23, 6, C.flame);
    t('Window ' + view.physW + ' x ' + view.physH + ' px', 10, 33, 7, C.text);
    t('Scale ' + (view.whole ? view.scale + 'x' : view.scale.toFixed(2) + 'x') + ', pixels square: ' + (view.whole ? 'yes' : 'no'), 10, 43, 7, C.text);
    t(fps.secs < 2 ? 'Measuring speed' : fps.now + ' fps now, lowest ' + fps.low, 10, 53, 7, C.text);
    t('Controller: ' + padInfo, 10, 63, 7, C.text);
    t('Next clicks: grid, then controller setup', 10, 73, 6, C.dim);
  }

  // ---- main loop: fixed 60 steps a second so it plays the same on any refresh rate ----
  var last = 0, acc = 0, manual = false;
  function frame(now) {
    var t0 = performance.now();
    if (!manual) {
      var dt = last ? (now - last) / 1000 : STEP;
      last = now;
      acc += Math.min(dt, 0.1);
      fps.frames++; fps.acc += dt;
      if (fps.acc >= 1) {
        fps.now = Math.round(fps.frames / fps.acc); fps.secs++; fps.ms = Math.round(fps.work / fps.frames * 10) / 10; fps.work = 0;
        if (fps.secs === 2 || (fps.secs > 2 && fps.now < fps.low)) fps.low = fps.now;
        fps.frames = 0; fps.acc = 0;
        fps.city = city && cityOn ? city.stats.ev - (fps.cityLast || 0) : -1; fps.cityLast = city ? city.stats.ev : 0;   // city life changes shown in the last second (-1: none here or off)
      }
      var inp = readInput();
      if (wiz.on) { wizTick(); acc = 0; render(); window.requestAnimationFrame(frame); return; }
      var any = inp.x || inp.y || inp.jump || inp.dash || inp.grab || inp.shoot || inp.back || inp.pageL || inp.pageR;
      if (scene !== 'play') {                      // menu or map: nothing moves, so nothing is redrawn until you press something
        if (any) demo.idle = 0;
        else { demo.idle += Math.min(dt, 0.1); if (demo.idle >= DEMO_IDLE || location.hash === '#demo') startDemo(); }
        if (scene === 'settings') settingsTick(inp); else if (scene !== 'play') screenInput(inp);
        acc = 0;
      } else if (demo.on && any) { demo.on = false; toMenu(); navPrev = inp; acc = 0; }
      else {
        if (pause.on) { pauseInput(inp, navPrev); acc = 0; }
        else if (inp.back && !navPrev.back && !testMode && !demo.on && !embedded) { if (run.won && run.result && staged()) leavePlay(); else openPause(); acc = 0; }
        navPrev = inp;
        while (scene === 'play' && !pause.on && acc >= STEP) { step(demo.on ? demoInput() : inp); acc -= STEP; }
      }
    }
    render();
    fps.work += performance.now() - t0;
    window.requestAnimationFrame(frame);
  }

  try { useLive(JSON.parse(localStorage.getItem(LIVE_KEY))); } catch (e) {}
  rebuildLevels();
  resetRun();
  if (!embedded) { fetchLive(); scene = 'menu'; }
  try {                                              // just switched theme: come back to the THEME page
    if (!embedded && sessionStorage.getItem(THEME_KEY + '.back')) {
      sessionStorage.removeItem(THEME_KEY + '.back'); openSettings();
      set.topRow = 2; set.page = 'theme'; set.row = GB.kind === 'bw' ? 2 : GB.on ? 1 : 0; set.note = GB.kind === 'bw' ? 'BLACK AND WHITE ON' : GB.on ? 'GAME BOY ON' : 'ORIGINAL ON';
    }
  } catch (e) {}

  // The room builder runs this same game in a frame and hands it the room being edited.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'climber-room') return;
    try { buildRoom(d.room); } catch (err) { window.parent.postMessage({ type: 'climber-error', message: String(err.message) }, '*'); return; }
    testMode = true; scene = 'play'; demo.on = false; demo.idle = 0; resetRun(); lastSig = ''; window.focus();
  });
  if (embedded) window.parent.postMessage({ type: 'climber-ready' }, '*');
  setWeather(weather.on);
  layout();
  window.requestAnimationFrame(frame);

  // Hook for the level builder's validator and for automated checks.
  window.__climber = {
    manual: function (on) { manual = on; },
    step: function (inp, n) { for (var i = 0; i < (n || 1); i++) step(inp); return this.state(); },
    state: function () {
      return { x: pl.x, y: pl.y, vx: Math.round(pl.vx), vy: Math.round(pl.vy), state: pl.state, ground: pl.onGround,
               dashes: pl.dashes, stamina: Math.round(pl.stamina), dead: pl.dead, deaths: run.deaths, won: run.won,
               movers: movers.map(function (m) { return { x: m.x, y: m.y, wait: m.wait, z: m.zip ? m.zs : '' }; }),
               fireballs: fireballs.map(function (f) { return { x: f.x, y: f.y, dir: f.dir, wait: f.wait }; }), gem: gotGem(), cam: cam.y,
               keys: roomKeys.map(function (k) { return k.state; }), doors: doors.map(function (d) { return d.open; }),
               jets: jets.map(function (j) { var p = jetPhase(j); return { x: j.x, y: j.y, on: p.on, warn: p.warn, left: p.left }; }), lava: lava ? lava.y : null,
               drones: drones.map(function (d) { return { x: d.x, y: d.y, dir: d.dir, wait: d.wait, fire: d.fire }; }),
               foes: foes.map(function (f) { return { x: f.x, y: f.y, dir: f.dir, state: f.state, hp: f.hp, big: f.big }; }), barrels: barrels.map(function (b) { return b.state; }), shots: shots.length, foeShots: foeShots.map(function (s) { return { x: s.x, y: s.y, big: s.big }; }) };
    },
    reset: function () { scene = 'play'; mode = 'map'; resetRun(); }, kill: die,
    rumble: function () { return { on: rumbleOn, calls: rmb.calls }; },
    view: function () { return { scene: scene, pause: { on: pause.on, pick: pause.pick }, set: { page: set.page, row: set.row, note: set.note, id: scene === 'settings' ? setRows()[set.row][0] : '' }, mode: mode, sel: sel, lvl: lvl, room: room.name, prog: prog, levels: levels.map(function (l) { return l.map(function (r) { return r.name; }); }), result: run.result, time: run.time }; },
    weather: function (on) { setWeather(on); return weather.on; },
    city: function (on) { if (on === 'ship') { if (city) city.nextShip = ct; } else if (on !== undefined) setCity(on); return { on: cityOn, live: !!city, movers: city ? city.movers.map(function (m) { return { kind: m.kind, x: Math.round(m.x), y: m.y }; }) : [], stats: city ? city.stats : null, lanes: city ? city.lanes.map(function (l) { return l.depth.charAt(1) + l.y; }) : [], chunks: chunkCopies, tick: tick, ms: fps.ms, fps: fps.now }; },
    nav: function (o) { screenInput(Object.assign({ x: 0, y: 0, jump: false, dash: false, grab: false, back: false, pageL: false, pageR: false }, o)); screenInput({ x: 0, y: 0, jump: false, dash: false, grab: false, back: false, pageL: false, pageR: false }); return this.view(); },
    startLevel: startLevel,
    mapTile: function (i) { mapScroll(levels[sel.w].length); var q = nodePos(i); return { x: q.x, y: tileY(q.row) + MAPV.th / 2 }; },   // tests: where a tile sits on the map
    padLevels: function (w, n) { var l = levels[w], k = l.length; while (l.length < n) l.push(l[l.length % k]); dataVer++; lastSig = ''; },   // tests only: fill a world to n levels to check the map
    demoAll: function () { // plays every recorded demo to the end, to prove the recordings still reach the exit
      var out = {}, i, n;
      for (i = 0; i < starters.length; i++) {
        demo.room = starters[i]; demo.rec = DEMOS[starters[i].id] || null; if (!demo.rec) { out[starters[i].name] = 'no recording'; continue; }   // wide: level 1 is recorded like the rest
        demo.rk = 0; demo.rleft = demo.rec ? demo.rec[1] : 0;
        scene = 'play'; demo.on = true; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false; demo.winT = 0; resetRun();
        for (n = 0; n < 4000 && !run.won && !pl.dead; n++) step(demoInput());
        out[starters[i].name] = run.won ? 'won ' + n : (pl.dead ? 'died ' + n : 'ran out ' + n);
      }
      demo.on = false; return out;
    },
    levelProbe: function () { // plays level 1-1 from the map with the demo's inputs, to prove scoring and saving
      startLevel(0, 0); demo.rec = null; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false;
      var n = 0; while (!run.won && n < 3000) { step(demoInput()); n++; }
      return this.view();
    },
    demoLevel: function (id) {   // tests: play one built-in level's recording as the idle demo, with rendering on (the camera, parallax)
      for (var i = 0; i < starters.length; i++) if (starters[i].id === id) demo.room = starters[i];
      scene = 'play'; demo.on = true; demo.rec = DEMOS[id] || null; demo.rk = 0; demo.rleft = demo.rec ? demo.rec[1] : 0; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false; demo.winT = 0; allDirty = true; lastSig = ''; resetRun();
    },
    demoStart: function () { startDemo(); }, demoStep: function (n) { for (var i = 0; i < n; i++) step(demoInput()); return this.state(); },
    load: function (data) { testMode = true; scene = 'play'; buildRoom(data); resetRun(); },
    tune: function (k, v) { var old = P[k]; if (v !== undefined) P[k] = v; return old; },   // tests only: switch a move off to prove a room needs it
    // Save and restore everything the physics reads, so a solver can try many inputs from one moment (tests only).
    snap: function () {
      var cp = function (a) { return a.map(function (o) { return Object.assign({}, o); }); };
      return JSON.parse(JSON.stringify({ pl: pl, run: run, fx: fx, cr: cp(crumbles), mv: cp(movers), fb: cp(fireballs), dn: cp(drones), sp: cp(springs),
        gm: cp(gems), ky: cp(roomKeys), dr: cp(doors), rf: cp(refills), lava: lava ? Object.assign({}, lava) : null,
        fo: cp(foes), br: cp(barrels), sh: cp(shots), fs: cp(foeShots), stop: combat.stop }));
    },
    restore: function (s) {
      var put = function (a, b) { for (var i = 0; i < a.length; i++) Object.assign(a[i], b[i]); };
      pl = JSON.parse(JSON.stringify(s.pl)); run = Object.assign({}, s.run); fx = Object.assign({}, s.fx);
      put(crumbles, s.cr); put(movers, s.mv); put(fireballs, s.fb); put(drones, s.dn); put(springs, s.sp);
      put(gems, s.gm); put(roomKeys, s.ky); put(doors, s.dr); put(refills, s.rf); if (lava && s.lava) Object.assign(lava, s.lava);
      if (s.fo) { put(foes, s.fo); put(barrels, s.br); shots = s.sh.map(function (o) { return Object.assign({}, o); }); foeShots = s.fs.map(function (o) { return Object.assign({}, o); }); combat.stop = s.stop; }
    },
    demoRun: function (n) { startDemo(); demo.room = starters[0]; demo.rec = DEMOS[starters[0].id] || null; demo.rk = 0; demo.rleft = demo.rec ? demo.rec[1] : 0; resetRun(); for (var i = 0; i < n && !run.won; i++) step(demoInput()); return { steps: i, won: run.won, deaths: run.deaths, stage: demo.stage }; }
  };
})();
</script>
